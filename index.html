<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurassic Park — Le Jeu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://pixijs.download/v8.6.6/pixi.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>🦖 Jurassic Park</h1>
      <div id="status">Chargement…</div>
    </header>
    <main id="stage-container">
      <div id="map-overlay">
        <div class="compass">
          <span class="c-n">N</span><span class="c-w">O</span>
          <span class="c-dot">✦</span><span class="c-e">E</span><span class="c-s">S</span>
        </div>
        <div class="legend">
          <div class="lg-row"><span class="sw oval spitter"></span>Dilophosaurus <em>(Spitter)</em></div>
          <div class="lg-row"><span class="sw oval raptor"></span>Velociraptor <em>(Raptor)</em></div>
          <div class="lg-row"><span class="sw oval trex"></span>Tyrannosaurus Rex <em>(T-Rex)</em></div>
          <div class="lg-row"><span class="sw fence"></span>Clôture électrique</div>
          <div class="lg-row"><span class="sw road"></span>Tour Road</div>
          <div class="lg-row"><span class="sw disc">🚁</span>Héliport</div>
          <div class="lg-row"><span class="sw disc">⛴️</span>Port</div>
        </div>
        <div class="jp-logo">
          <span class="jp-rex">🦖</span>
          <span class="jp-name">JURASSIC PARK</span>
          <span class="jp-sub">Game</span>
        </div>
      </div>
    </main>
    <aside id="sidebar"></aside>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
